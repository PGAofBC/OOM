<style>
  :root{
    --green:#00A651;
    --green-dark:#007a3c;
    --forest:#0e3d22;
    --stripe:#f2f9f4;
    --line:#dcebe1;
    --ink:#1c2b22;
    --muted:#5f7568;
    --gold:#c9a227;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Barlow',-apple-system,'Segoe UI',Arial,sans-serif;
    color:var(--ink);
    background:#fff;
    display:flex;
    flex-direction:column;
  }
  .masthead{
    background:linear-gradient(135deg,var(--forest) 0%,var(--green-dark) 60%,var(--green) 100%);
    color:#fff;
    padding:14px 18px 12px;
    flex:0 0 auto;
  }
  .masthead .row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;}
  .masthead h1{
    font-family:'Barlow Condensed','Barlow',sans-serif;
    font-weight:700;font-size:1.5rem;letter-spacing:.02em;text-transform:uppercase;line-height:1.1;
  }
  .masthead h1 span{color:#a8e6c3;font-weight:600;}
  .hashtag{font-weight:600;color:#a8e6c3;font-size:.9rem;letter-spacing:.03em;}
  .toolbar{
    display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap;
  }
  .toolbar input{
    flex:1 1 220px;
    font:inherit;font-size:.9rem;
    padding:7px 12px;
    border:none;border-radius:6px;
    background:rgba(255,255,255,.94);color:var(--ink);
  }
  .toolbar input:focus{outline:2px solid #a8e6c3;outline-offset:1px;}
  .count{font-size:.82rem;color:#d5f2e1;white-space:nowrap;}
  .table-wrap{
    flex:1 1 auto;
    overflow:auto;
    -webkit-overflow-scrolling:touch;
  }
  table{
    width:100%;
    border-collapse:collapse;
    font-size:.86rem;
    min-width:860px;
  }
  thead th{
    position:sticky;top:0;z-index:2;
    background:var(--green);
    color:#fff;
    font-family:'Barlow Condensed','Barlow',sans-serif;
    font-weight:600;font-size:.82rem;
    text-transform:uppercase;letter-spacing:.05em;
    padding:9px 10px;
    text-align:right;
    border-bottom:2px solid var(--green-dark);
    white-space:nowrap;
  }
  thead th.left{text-align:left;}
  tbody td{
    padding:7px 10px;
    border-bottom:1px solid var(--line);
    text-align:right;
    font-variant-numeric:tabular-nums;
    white-space:nowrap;
  }
  tbody td.left{text-align:left;white-space:normal;}
  tbody tr:nth-child(even){background:var(--stripe);}
  tbody tr:hover{background:#e3f4ea;}
  td.player{font-weight:600;}
  td.facility{color:var(--muted);}
  td.total{font-weight:700;color:var(--green-dark);}
  .rank-chip{
    display:inline-block;min-width:2.1em;text-align:center;
    font-weight:600;color:var(--muted);
  }
  tr.podium .rank-chip{
    background:var(--gold);color:#fff;border-radius:999px;
    padding:1px 6px;font-weight:700;
  }
  tr.podium td.player{color:var(--forest);}
  .empty{
    padding:28px 18px;text-align:center;color:var(--muted);font-size:.9rem;display:none;
  }
  @media (max-width:640px){
    .masthead h1{font-size:1.2rem;}
    table{font-size:.8rem;}
  }
</style>
</head>

const rows = DATA.trim().split("\n").map(l => l.split("|"));
const tbody = document.getElementById("tbody");
const empty = document.getElementById("empty");
const count = document.getElementById("count");
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

tbody.innerHTML = rows.map(r => {
  const rank = parseInt(r[0], 10);
  return `<tr class="${rank <= 3 ? "podium" : ""}">
    <td><span class="rank-chip">${rank}</span></td>
    <td class="left player">${esc(r[1])}</td>
    <td class="left facility">${esc(r[2]) || "—"}</td>
    <td>${r[3]}</td><td>${r[4]}</td><td>${r[5]}</td><td>${r[6]}</td><td>${r[7]}</td>
    <td class="total">${r[8]}</td>
  </tr>`;
}).join("");

const trs = Array.from(tbody.rows);
const haystacks = rows.map(r => (r[1] + " " + r[2]).toLowerCase());
const total = trs.length;

function updateCount(shown){
  count.textContent = shown === total ? `${total} players` : `${shown} of ${total} players`;
}
updateCount(total);

document.getElementById("search").addEventListener("input", e => {
  const q = e.target.value.trim().toLowerCase();
  let shown = 0;
  trs.forEach((tr, i) => {
    const show = !q || haystacks[i].includes(q);
    tr.style.display = show ? "" : "none";
    if (show) shown++;
  });
  empty.style.display = shown ? "none" : "block";
  updateCount(shown);
});
</script>
